name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check . --target-version py312
      - name: Ruff format check
        run: ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Mypy strict type check
        run: mypy agent api shared

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@localhost:5432/inventory_agent
      CHECKPOINTER_DATABASE_URL: postgresql://inventory:inventory@localhost:5432/inventory_agent
      ENVIRONMENT: testing
      ALLOW_DEMO_KEY: 'true'
      AGENT_API_KEY: demo-key-2024
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/test_integration.py --ignore=tests/eval_suite.py

  integration-tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@localhost:5432/inventory_agent
      CHECKPOINTER_DATABASE_URL: postgresql://inventory:inventory@localhost:5432/inventory_agent
      ENVIRONMENT: testing
      ALLOW_DEMO_KEY: 'true'
      AGENT_API_KEY: demo-key-2024
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Schema drift check
        run: alembic check || (echo "Schema drift detected — run 'alembic revision --autogenerate' and commit the migration" && exit 1)
      - name: Run integration tests
        run: pytest tests/test_integration.py -v
      - name: Run eval suite
        run: pytest tests/eval_suite.py -v

  eval-suite:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run eval suite
        run: pytest tests/eval_suite.py -v

  frontend-tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: inventory-frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd inventory-frontend && npm ci
      - name: Run unit tests
        run: cd inventory-frontend && npm test
      - name: Build frontend
        run: cd inventory-frontend && npm run build

  e2e-tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@localhost:5432/inventory_agent
      CHECKPOINTER_DATABASE_URL: postgresql://inventory:inventory@localhost:5432/inventory_agent
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development
      ALLOW_DEMO_KEY: 'true'
      AGENT_API_KEY: demo-key-2024
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Seed demo data
        run: python seed_demo_data.py
      - name: Start API server
        run: |
          python -m uvicorn api.main:app --host 0.0.0.0 --port 8002 &
          sleep 8
          curl -sf http://localhost:8002/health || exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: inventory-frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd inventory-frontend && npm ci
      - name: Install Playwright browsers
        run: cd inventory-frontend && npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: cd inventory-frontend && npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: inventory-frontend/playwright-report/
          retention-days: 14
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: inventory-frontend/test-results/
          retention-days: 14

  docker-build:
    needs: [unit-tests, integration-tests, eval-suite, frontend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
