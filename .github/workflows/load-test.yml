name: Load Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'API base URL for load testing'
        required: false
        default: 'http://localhost:8002'
      load_profile:
        description: 'Load profile: ci (light, shared runner) or deployed (aggressive, strict)'
        required: false
        default: 'ci'

env:
  BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:8002' }}
  LOAD_PROFILE: ${{ github.event.inputs.load_profile || 'ci' }}

jobs:
  load-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'load-test'))

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://inventory:inventory@localhost:5432/inventory_agent
        run: alembic upgrade head

      - name: Start API server
        env:
          DATABASE_URL: postgresql+asyncpg://inventory:inventory@localhost:5432/inventory_agent
          REDIS_URL: redis://localhost:6379/0
          AGENT_API_KEY: demo-key-2024
          ENVIRONMENT: development
          RATE_LIMIT_ENABLED: "false"
        run: |
          python -m uvicorn api.main:app --host 0.0.0.0 --port 8002 &
          sleep 5
          curl -sf http://localhost:8002/health || exit 1

      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v2.1.0/k6-v2.1.0-linux-amd64.deb -o /tmp/k6.deb
          sudo dpkg -i /tmp/k6.deb
          k6 version

      - name: Run load tests
        env:
          K6_BASE_URL: ${{ env.BASE_URL }}
          K6_LOAD_PROFILE: ${{ env.LOAD_PROFILE }}
        run: |
          k6 run \
            --out json=load/results.json \
            --summary-export=load/summary.json \
            -e BASE_URL=$K6_BASE_URL \
            -e LOAD_PROFILE=$K6_LOAD_PROFILE \
            load/load_test.js

      - name: Validate thresholds
        env:
          P95_THRESHOLD_MS: ${{ env.LOAD_PROFILE == 'deployed' && 3000 || 5000 }}
        run: |
          if [ -f load/summary.json ]; then
            ERROR_RATE=$(python3 -c "import json; d=json.load(open('load/summary.json')); print(d.get('metrics',{}).get('http_req_failed',{}).get('value', 0))")
            P95=$(python3 -c "import json; d=json.load(open('load/summary.json')); print(d.get('metrics',{}).get('http_req_duration',{}).get('p(95)', 0))")
            echo "Error rate: $ERROR_RATE (threshold: 0.05)"
            echo "P95 latency: ${P95}ms (threshold: ${P95_THRESHOLD_MS}ms)"
            python3 -c "
          import sys
          rate = float('$ERROR_RATE')
          p95 = float('$P95')
          failed = False
          if rate > 0.05:
              print(f'FAIL: error rate {rate:.3f} > 0.05')
              failed = True
          if p95 > $P95_THRESHOLD_MS:
              print(f'FAIL: p95 latency {p95:.0f}ms > $P95_THRESHOLD_MS')
              failed = True
          if failed:
              sys.exit(1)
          print('PASS: all load test thresholds met')
          "
          else
            echo "FAIL: load/summary.json missing — k6 did not produce a summary"
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load/
          retention-days: 30
