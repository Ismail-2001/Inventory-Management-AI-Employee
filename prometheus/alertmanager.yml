global:
  resolve_timeout: 5m
  # REQUIRED: replace with your Slack incoming webhook URL before enabling Slack
  # notifications. Keep the value as a no-op placeholder to run without Slack.
  slack_api_url: "https://SLACK-WEBHOOK-URL-PLACEHOLDER.invalid"

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - matchers:
        - severity="critical"
      receiver: "critical"

receivers:
  - name: "default"
    slack_configs:
      - channel: "#inventory-alerts"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          **{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          Labels: {{ .Labels }}
          {{ end }}

  - name: "critical"
    slack_configs:
      - channel: "#inventory-critical"
        send_resolved: true
        title: "[CRITICAL] {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          **{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          {{ end }}
