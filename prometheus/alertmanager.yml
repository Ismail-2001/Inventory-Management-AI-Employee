global:
  resolve_timeout: 5m
  # Set SLACK_WEBHOOK_URL in your .env file: https://hooks.slack.com/services/T00/BOT/XXXX
  slack_api_url: "${SLACK_WEBHOOK_URL:-REPLACE_WITH_YOUR_SLACK_WEBHOOK_URL}"

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - matchers:
        - severity="critical"
      receiver: "critical"

receivers:
  - name: "default"
    slack_configs:
      - channel: "#inventory-alerts"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          **{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          Labels: {{ .Labels }}
          {{ end }}

  - name: "critical"
    slack_configs:
      - channel: "#inventory-critical"
        send_resolved: true
        title: "[CRITICAL] {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          **{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          {{ end }}
