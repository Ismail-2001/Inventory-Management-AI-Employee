services:
  inventory-agent:
    build: .
    ports:
      - "8002:8002"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AGENT_API_KEY=${AGENT_API_KEY:-demo-key-2024}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3