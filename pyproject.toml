[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Ensure `pytest tests/` (CI runs the bare command, not `python -m pytest`)
# can import the `agent`/`shared` packages at the repo root.
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies in parameter defaults are the framework's idiomatic
# dependency-injection pattern (not accidental function calls).
extend-immutable-calls = ["fastapi.Depends", "agent.auth.require_role"]

[tool.ruff.lint.per-file-ignores]
# api/main.py must configure logging/telemetry before importing modules that
# instantiate loggers and tracers, so its imports are deliberately mid-file.
"api/main.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "opentelemetry.*",
    "slowapi.*",
    "langgraph.*",
    "langsmith.*",
    "passlib.*",
    "psycopg.*",
    "sqlalchemy.*",
    "starlette.*",
    "httpx.*",
    "groq.*",
    "google.*",
]
ignore_missing_imports = true
