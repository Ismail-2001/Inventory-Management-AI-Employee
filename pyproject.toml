[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "opentelemetry.*",
    "slowapi.*",
    "langgraph.*",
    "langsmith.*",
    "passlib.*",
    "psycopg.*",
    "sqlalchemy.*",
    "starlette.*",
    "httpx.*",
    "groq.*",
    "google.*",
]
ignore_missing_imports = true
